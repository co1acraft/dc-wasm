<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dead Cells (WASM)</title></head>
<body style="margin:0;background:#111">
<canvas id="canvas" width="1280" height="720" style="width:1280px;height:720px;display:block" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
// Force preserveDrawingBuffer so the rendered frame survives compositing (lets
// screenshots/screencasts capture it; otherwise the canvas reads back black even
// though it renders fine). Must run before the WebGL context is created.
(function(){
  var _gc = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, attrs){
    if(type && type.indexOf('webgl')>=0){ attrs = attrs || {}; attrs.preserveDrawingBuffer = true; }
    return _gc.call(this, type, attrs);
  };
})();
// Console -> server (so headless runs can capture output) AND devtools.
function rlog(s){ try{ fetch('/log',{method:'POST',body:String(s)}); }catch(e){} try{ console.log(s); }catch(e){} }
window.onerror = function(m,src,l,c,e){ rlog('[onerror] '+m+' @'+src+':'+l+(e&&e.stack?'\n'+e.stack:'')); };
// SDL listens for keyboard on the *window*, so keys only arrive when the page/tab has
// keyboard focus. Grab focus on load/click/interval, and log focus/key/pointerlock so we
// can see exactly when keyboard stops reaching the page (DIAG).
(function(){
  var c = document.getElementById('canvas');
  function grab(){ try{ window.focus(); if(c.focus) c.focus({preventScroll:true}); }catch(e){} }
  window.addEventListener('load', grab);
  document.addEventListener('pointerdown', grab);
  document.addEventListener('mousedown', grab);
  setInterval(grab, 1000);                              // keep trying to hold focus
  var kn=0;
  window.addEventListener('keydown', function(e){ if(kn++<40) rlog('[input] keydown reached page: '+e.key+' (focus='+document.hasFocus()+' active='+(document.activeElement&&document.activeElement.tagName)+')'); }, true);
  window.addEventListener('blur',  function(){ rlog('[focus] WINDOW BLUR'); });
  window.addEventListener('focus', function(){ rlog('[focus] window focus'); });
  document.addEventListener('pointerlockchange', function(){ rlog('[focus] pointerLock='+(document.pointerLockElement?'ON':'off')); });
  document.addEventListener('fullscreenchange', function(){ rlog('[focus] fullscreen='+(document.fullscreenElement?'ON':'off')); });
})();
rlog('[harness] start');
var Module = {
  canvas: document.getElementById('canvas'),
  arguments: [],
  thisProgram: '/data/deadcells',
  ENV: { '_': '/data/deadcells' },         // so the game derives froot=/data
  preRun: [function(){                      // writable dirs for save files (MEMFS)
    ['/save','/data','/data/save','/.local','/.local/share'].forEach(function(d){
      try { FS.mkdir(d); } catch(e){}
    });
    rlog('[harness] created save dirs');
  }],
  print:    function(s){ rlog('[out] '+s); },
  printErr: function(s){ rlog('[err] '+s); },
  onRuntimeInitialized: function(){ rlog('[harness] runtime initialized'); },
  onAbort: function(w){ rlog('[abort] '+w); },
};
// progress diagnostics: count animation frames + report canvas/GL state
var __raf = 0, __origRAF = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = function(cb){ __raf++; return __origRAF(cb); };
setInterval(function(){
  var c = document.getElementById('canvas');
  rlog('[diag] rafFrames='+__raf+' canvas='+(c?c.width+'x'+c.height:'?')+' Module.ctx='+(typeof Module!=='undefined'&&!!Module.ctx));
}, 4000);
</script>
<script src="deadcells.js"></script>
</body>
</html>
